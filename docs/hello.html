<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Tester</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            padding: 10px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        #iframeUrl {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <input
            id="iframeUrl"
            type="text"
            placeholder="https://widget.midominio.com">
        <button id="loadBtn">Load iframe</button>
    </div>

    <iframe id="testFrame"></iframe>

    <script>
        const urlInput = document.getElementById("iframeUrl");
        const iframe = document.getElementById("testFrame");

        function loadIframe() {
            const url = urlInput.value.trim();

            if (!url) {
                alert("Introduce una URL");
                return;
            }

            iframe.src = url;
        }

        document.getElementById("loadBtn")
            .addEventListener("click", loadIframe);

        urlInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                loadIframe();
            }
        });

        window.addEventListener("message", event => {
            console.log("Mensaje recibido:", event.origin, event.data);
        });
    </script>

</body>
</html>
